name: build

# 每次提交（任何分支）自动打包；提交到 main 时自动发**正式版** Release。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write           # 建 Release / 上传附件 / 置为 latest

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false  # 同分支多次提交排队跑，避免两个 run 抢着建同一个 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 仓库来自 Windows 开发机，补可执行位，免得 checkout 丢了 +x 后 ./gradlew 报 Permission denied
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read mod version
        id: ver
        run: |
          V=$(grep -E '^mod_version=' gradle.properties | head -1 | cut -d= -f2 | tr -d ' \r')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "mod_version = $V"

      # gradle.properties 把 JDK 搜索路径钉在开发机的 D:\java（runner 上不存在）；
      # 命令行 -D 覆盖成 runner 自己的 JDK，免得 Gradle 工具链找不到。
      - name: Build
        run: |
          ./gradlew build cleanJar --no-daemon --stacktrace \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: apocalypse_zombies-${{ steps.ver.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error

      # 预览版：每次提交都刷新同一个预发布（tag=preview），固定下载地址，附：
      #   开发包 = 含临时借用的 TaCZ 音效与转录动画，仅供本地预览/自用
      #   纯净包 = 剥掉第三方内容的 -clean 包
      - name: Publish preview pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          DEV=$(ls build/libs/apocalypse_zombies-*.jar | grep -v -- '-clean\.jar$' | head -1)
          CLEAN=$(ls build/libs/*-clean.jar | head -1)
          NOTES=$(printf '最新构建（预览版），每次提交自动刷新。\n\n- 开发包：`%s`\n- 纯净包：`%s`\n- `mod_version`：`%s`　分支：`%s`　提交：`%s`\n\n> 开发包含临时借用的 TaCZ 音效与转录动画，**仅供本地预览/自用**；\n> 要发布请用 `v*` **正式版**里附的 -clean 包。\n' "$(basename "$DEV")" "$(basename "$CLEAN")" "$VERSION" "$BRANCH" "$GITHUB_SHA")
          echo "preview: $DEV + $CLEAN"
          if gh release view preview >/dev/null 2>&1; then
            gh release upload preview "$DEV" "$CLEAN" --clobber
            gh release edit preview --title "预览版（最新构建）" --notes "$NOTES"
          else
            gh release create preview "$DEV" "$CLEAN" \
              --title "预览版（最新构建）" \
              --notes "$NOTES" \
              --prerelease
          fi

      # 正式版：合到 main 才发，tag = v<mod_version>，附件 = 分发用的 -clean 包。
      # 同一版本的后续提交 = 覆盖附件 + 刷新说明，不会重复建 Release。
      - name: Publish official release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          TAG="v${VERSION}"
          JAR=$(ls build/libs/*-clean.jar | head -1)
          NOTES=$(printf '自动打包产物：`%s`（分发用纯净包，不含第三方借用内容）。\n\n- 模组版本：`%s`（`gradle.properties` 的 `mod_version`）\n- 源码提交：`%s`\n- 依赖：Forge 1.20.1-47.4.0+；**GeckoLib 4.8.4 需自行安装**\n- 变更记录见 `readme.md` 的更新日志\n' "$(basename "$JAR")" "$VERSION" "$GITHUB_SHA")
          echo "release: $TAG   artifact: $JAR"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            gh release edit "$TAG" --title "Apocalypse Zombies ${TAG}" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$JAR" \
              --title "Apocalypse Zombies ${TAG}" \
              --notes "$NOTES" \
              --latest
          fi
