# Gradle
# Short socket timeouts so a flaky Mojang/Forge download fails fast instead of hanging the build.
org.gradle.jvmargs=-Xmx4G -Djava.net.preferIPv6Addresses=true -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=180000
# ForgeGradle talks to Mojang/Forge over plain HTTP; keep those from hanging forever.
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=180000
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 工具链：JDK 17 由 Gradle 自己解决 —— 先认 JAVA_HOME（CI 上由 actions/setup-java 装好），
# 找不到就按 settings.gradle 里的 foojay 解析器自动下载一个（下载进 ~/.gradle/jdks/）。
org.gradle.java.installations.auto-download=true
# ⚠ 不要在这文件里写机器专属的绝对路径：org.gradle.java.installations.paths=D:\java 在 Linux runner 上
# 会被 Gradle 当成 URI 解析，配置期直接崩（Illegal character in opaque part at index 2）。
# 本机的额外 JDK 位置写用户级 ~/.gradle/gradle.properties（org.gradle.java.home 也在那里）。

